services:
  db:
    image: postgres:16
    container_name: parkinsons-pal-postgres
    environment:
      POSTGRES_DB: parkinsons_pal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  parkinsons-api:
    build: .
    container_name: parkinsons-pal-api
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@localhost:5432/parkinsons_pal
      - DB_URL=postgres://postgres:postgres@localhost:5432/parkinsons_pal
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    network_mode: host
